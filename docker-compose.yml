services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opencloud
      POSTGRES_USER: opencloud
      POSTGRES_PASSWORD: opencloud
    # Loopback-only, for the same reason as redis: so `manage.py` on the host can
    # migrate and test against the real database instead of sqlite.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opencloud']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Loopback-only, so `manage.py runserver` on the host can share this cache
    # (and keep sessions / the token vault across autoreloads).
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://opencloud:opencloud@db:5432/opencloud
      REDIS_URL: redis://redis:6379/0
      USE_REDIS_CACHE: 'true'
      CELERY_BROKER_URL: redis://redis:6379/0
      # Local docker runs over http; real deploys put TLS at nginx and drop these.
      SECURE_SSL_REDIRECT: 'false'
      SESSION_COOKIE_SECURE: 'false'
      CSRF_COOKIE_SECURE: 'false'
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A config worker -l info
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://opencloud:opencloud@db:5432/opencloud
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

  beat:
    build: .
    command: celery -A config beat -l info
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://opencloud:opencloud@db:5432/opencloud
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  pgdata:
