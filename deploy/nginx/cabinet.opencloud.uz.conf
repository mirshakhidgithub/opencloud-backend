# Host nginx for the Open Cloud console. Both upstreams are published on loopback
# by the two compose stacks, so this file is the only thing facing the internet.
#
#   sudo cp deploy/nginx/cabinet.opencloud.uz.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/cabinet.opencloud.uz.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS uses the existing *.opencloud.uz wildcard — no certbot here, nothing to
# renew. The paths below are the ones this host already serves other sites from,
# so this file needs no editing after copying.
#
# nginx does not send intermediates it was not given: ssl_certificate must be the
# leaf followed by the chain, in that order, in one file. If clients report an
# untrusted certificate, that file holds only the leaf.

# Ports 3000 and 8000 are taken on this host by other applications, so the two
# stacks publish on 3010 and 8010 (FRONTEND_PORT / WEB_PORT in their .env files).
# These two blocks and those variables have to say the same thing.
upstream opencloud_frontend {
    server 127.0.0.1:3010;
    keepalive 16;
}

upstream opencloud_backend {
    server 127.0.0.1:8010;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name cabinet.opencloud.uz;

    # Nothing is served over http: the certificate is a wildcard that already
    # exists, so there is no ACME challenge to leave reachable.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `http2 on;` is nginx 1.25+; this host runs 1.18, where HTTP/2 is a listen
    # parameter. The neighbouring sites are written the same way.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cabinet.opencloud.uz;

    # The *.opencloud.uz wildcard, which already covers this host. Whoever
    # replaces that certificate replaces it for this site too — there is nothing
    # here to renew separately.
    ssl_certificate     /etc/ssl/opencloud.crt;
    ssl_certificate_key /etc/ssl/opencloud.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Django sends HSTS itself (SECURE_HSTS_SECONDS), but the frontend answers
    # most requests, so the header is set here to cover the whole origin.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The console is a dashboard, not an upload service; the largest body it
    # sends is a form. Raise it if that ever stops being true.
    client_max_body_size 2m;

    access_log /var/log/nginx/cabinet.opencloud.uz.access.log;
    error_log  /var/log/nginx/cabinet.opencloud.uz.error.log;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Django's SECURE_PROXY_SSL_HEADER reads this. Without it every request looks
    # like plain http and the SSL redirect loops.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # The API goes straight to Django. Next can proxy it too (that is the dev
    # path), but there is no reason to add a hop in production.
    location /api/v1/ {
        proxy_pass http://opencloud_backend;
        # Some cloud calls fan out to Zadara and are slower than a page render.
        proxy_read_timeout 120s;
        # Django sends HSTS too, and two of the same header on one response is
        # the kind of thing a scanner flags. The one above covers the whole
        # origin, including the pages Django never sees.
        proxy_hide_header Strict-Transport-Security;
    }

    # Django's own static files — admin and the Swagger page — served by
    # WhiteNoise inside the container with hashed, immutable names.
    location /static/ {
        proxy_pass http://opencloud_backend;
        proxy_cache_valid 200 1h;
        proxy_hide_header Strict-Transport-Security;
    }

    # Django's own admin (at /django-admin/, so it cannot collide with the
    # console's /admin/* screens) is deliberately NOT proxied: it registers no
    # models and nobody signs in there with a Zadara identity. To reach it for a
    # one-off, uncomment this and allow only the addresses that should have it.
    # location /django-admin/ {
    #     allow 203.0.113.0/24;
    #     deny all;
    #     proxy_pass http://opencloud_backend;
    # }

    # Everything else is the Next.js console, including /_next/static.
    location / {
        proxy_pass http://opencloud_frontend;
        proxy_read_timeout 60s;
    }
}
